name: Deploy

# Só disparo manual enquanto a hospedagem ativa for o Render (que faz o próprio deploy a partir
# de `dev`) — com push automático, o job falharia a cada push por falta dos secrets da VPS.
on:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Oracle Cloud VPS
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ~/squadup-back
            git fetch origin dev
            git reset --hard origin/dev
            docker compose up -d --build
            docker image prune -f
